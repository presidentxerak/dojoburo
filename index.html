<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- clair par défaut · la barre du navigateur doit s'accorder au thème
         servi, sinon on obtient une encoche noire au-dessus d'une page
         blanche, lue comme un défaut d'affichage et non comme un réglage -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      La police, sans bloquer le premier pixel · voir public/boot.js.

      `media="print"` la retire du chemin critique ; boot.js la remet pour
      l'écran dès qu'elle arrive. L'attribut `onload="…"` qu'on écrirait
      naturellement ici est refusé par la politique de sécurité du site
      (`script-src 'self'`, sans `'unsafe-inline'`) — et refusé en silence, ce
      qui laisserait le site sans sa typographie. `<noscript>` garde le chemin
      normal pour qui n'exécute pas de JavaScript.
    -->
    <link
      data-font
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      media="print"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="canonical" href="https://www.dojoburo.com/" />
    <meta name="description" content="Your company, already staffed. Pick from ready-made teams of AI teammates that arrive briefed and wired to your apps — and run them on your own Claude key, with no meter between you and your own work." />
    <title>DojoBuro · Your company, already staffed</title>
    <!-- Open Graph / social + search preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DojoBuro" />
    <meta property="og:title" content="DojoBuro · Your company, already staffed" />
    <meta property="og:description" content="Your company, already staffed. Pick from ready-made teams of AI teammates that arrive briefed and wired to your apps — and run them on your own Claude key, with no meter between you and your own work." />
    <meta property="og:url" content="https://www.dojoburo.com/" />
    <meta property="og:image" content="https://www.dojoburo.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DojoBuro · Your company, already staffed" />
    <meta name="twitter:description" content="Your company, already staffed. Pick from ready-made teams of AI teammates that arrive briefed and wired to your apps — and run them on your own Claude key, with no meter between you and your own work." />
    <meta name="twitter:image" content="https://www.dojoburo.com/og.png" />
    <!--
      Le thème et la police, posés AVANT le premier pixel · public/boot.js.

      Ce code était ÉCRIT ICI, en ligne. La politique de sécurité du site dit
      `script-src 'self'` sans `'unsafe-inline'` : le navigateur refusait donc
      de l'exécuter en production, sans que rien ne casse visiblement. Un
      fichier servi depuis la même origine passe — c'est la seule différence, et
      elle décide si ce code tourne.

      Synchrone, et dans le <head> : c'est ce qui le fait tourner avant que la
      feuille de style ne peigne quoi que ce soit.
    -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
